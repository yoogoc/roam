[workspace]
resolver = "3"
members = ["crates/roam-core", "crates/roam-ui", "crates/roam", "crates/roam-updater"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
roam-core = { path = "crates/roam-core" }
roam-ui = { path = "crates/roam-ui" }
roam-updater = { path = "crates/roam-updater" }
flate2 = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }

opendal = { version = "0.58.1", default-features = false, features = [
    "auto-register-services",
    "executors-tokio",
    "http-transport-reqwest",
    "services-fs",
    "services-s3",
    "services-gcs",
    "services-azblob",
    "services-webdav",
    "layers-retry",
    "layers-timeout",
    "layers-concurrent-limit",
] }
# Kit keeps GPUI, platform support, styled components and icons on matching releases.
gpui-kit = "0.6.1"

# "time" + "net" are what Runtime::enable_all() actually needs; the IO driver has
# to be live before M2 puts reqwest-backed services on this runtime.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "net",
    # The transfer engine streams to and from local files.
    "fs",
    "io-util",
] }
bytes = "1"
http = "1"
serde_json = "1"
base64 = "0.22"
p12-keystore = "0.3.2"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
sha2 = "0.10"
x509-cert = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
nfs3_client = { version = "0.9.0", features = ["tokio"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
# opendal 0.58 exposes timestamps as jiff::Timestamp, not chrono.
jiff = "0.2.28"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Archive trees only read metadata; Office and workbook previews also decode
# deflated ZIP entries.
zip = { version = "8.4", default-features = false, features = ["deflate"] }

# Keep layout, text input and drawing responsive in `cargo run`; application
# crates retain the default debug profile for quick edits and debugging.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.gpui-pre-macos]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2
