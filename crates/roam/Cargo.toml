[package]
name = "roam"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Roam — a cross-backend file browser"

[[bin]]
name = "roam"
path = "src/main.rs"

[dependencies]
roam-core.workspace = true
roam-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# ── packaging ─────────────────────────────────────────────────────────────
#
# `cargo packager --release` produces the .app and .dmg (and, on the other
# platforms, .deb/.AppImage/.msi). See docs/PACKAGING.md for why the app is signed
# with the hardened runtime and *not* sandboxed — cargo-packager already passes
# `--options runtime` for native binaries, and only passes `--entitlements` when
# one is configured, so leaving `entitlements` unset is what keeps App Sandbox off.
[package.metadata.packager]
product-name = "Roam"
# Must stay in step with `ProjectDirs::from("dev", "roam", "Roam")` in roam-core,
# which decides where profiles.toml lives. Changing it orphans existing configs.
identifier = "dev.roam.Roam"
description = "Cross-backend file browser"
long-description = """
Browse local disk, S3, Google Cloud Storage, Azure Blob Storage, WebDAV and SFTP
in one window, with transfers between them.
"""
homepage = "https://github.com/yoogoc/roam"
authors = ["yoogo"]
category = "Utility"

# cargo-packager packages a binary, it never builds one — so the build has to be
# named here. The hook runs through `sh -c`, so the expansion below is real: unset
# locally it builds for the host, and CI sets ROAM_BUILD_TARGET to cross-compile.
# One command that is correct in both places, rather than two that drift.
before-packaging-command = "cargo build --release -p roam ${ROAM_BUILD_TARGET:+--target $ROAM_BUILD_TARGET}"
binaries = [{ path = "roam", main = true }]

# The packager picks what each platform needs out of this list: .icns for macOS,
# .ico for Windows, the PNGs for Linux's hicolor theme.
icons = [
    "../../assets/app-icon/roam.icns",
    "../../assets/app-icon/roam.ico",
    "../../assets/app-icon/icon-16.png",
    "../../assets/app-icon/icon-32.png",
    "../../assets/app-icon/icon-64.png",
    "../../assets/app-icon/icon-128.png",
    "../../assets/app-icon/icon-256.png",
    "../../assets/app-icon/icon-512.png",
    "../../assets/app-icon/icon-1024.png",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# Uncomment once a Developer ID Application certificate exists. The identity
# *string* is not a secret — it is readable in every signed binary — so it belongs
# in the repo; the private key never does. Without it the bundle is left unsigned,
# which runs locally and nowhere else.
#
# cargo-packager always passes `--options runtime` for a native binary, and only
# passes `--entitlements` when one is configured. So this single line is the whole
# signing setup, and leaving `entitlements` unset is what keeps App Sandbox off —
# which matters, because turning it on breaks sftp (docs/PACKAGING.md).
# signing-identity = "Developer ID Application: NAME (TEAMID)"

# Notarization is credential-driven, not config-driven: cargo-packager notarizes
# when it finds APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY +
# APPLE_API_ISSUER + APPLE_API_KEY_PATH, or APPLE_KEYCHAIN_PROFILE. Absent those it
# logs a warning and carries on rather than failing.

[package.metadata.packager.deb]
# cargo-packager does not derive these — it writes exactly what is listed here, and
# nothing if the field is absent. A .deb with no Depends installs cleanly and then
# fails to start, which is the worst of the two failure modes.
#
# These are the runtime counterparts of the -dev packages the build needs (that list
# was found by building in a container, see docs/PACKAGING.md).
depends = [
    "libx11-6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libxcb1",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
    "libasound2t64 | libasound2",
    "libfontconfig1",
    "libfreetype6",
    "libgbm1",
    "libvulkan1",
    # The sftp backend runs it; without ssh that backend silently has no way to work.
    "openssh-client",
]

[package.metadata.packager.dmg]
# The classic drag-to-install window.
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }
