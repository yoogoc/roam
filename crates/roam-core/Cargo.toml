[package]
name = "roam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backend-agnostic core for Roam: VFS over OpenDAL, listing cache, tokio bridge"

[dependencies]
opendal.workspace = true
nfs3_client.workspace = true
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
jiff.workspace = true
dashmap.workspace = true
tracing.workspace = true
bytes.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
zip.workspace = true
http.workspace = true
serde_json.workspace = true
base64.workspace = true
p12-keystore.workspace = true
rsa.workspace = true
sha2.workspace = true
x509-cert.workspace = true
uuid.workspace = true
url.workspace = true
duckdb = { version = "1.10506.0", features = ["bundled", "json", "parquet"] }
calamine = "0.36"
tempfile = "3"
csv = "1"
apache-avro = "0.21"
arrow-ipc = "58"
rusqlite = { version = "0.39", features = ["bundled"] }
quick-xml = "0.39"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "ico", "jpeg"] }
resvg = "0.46"
tiff = "0.11"

[dev-dependencies]
rand = "0.10"
nfs3_server = { version = "0.11.0", features = ["memfs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile = "3"
# The S3 integration tests fetch a presigned URL with no credentials attached,
# which needs a plain HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
