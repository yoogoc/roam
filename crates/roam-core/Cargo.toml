[package]
name = "roam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backend-agnostic core for Roam: VFS over OpenDAL, listing cache, tokio bridge"

[dependencies]
opendal.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
jiff.workspace = true
dashmap.workspace = true
tracing.workspace = true
bytes.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true

# The sftp backend, everywhere it can exist. OpenDAL's sftp service is a wrapper
# around the system `ssh` binary (through `openssh`), and that crate is Unix-only
# — on Windows it does not compile, so the feature cannot simply live in the
# workspace manifest. Enabling it per-target compiles it in on macOS and Linux and
# leaves it out on Windows; `service::SERVICES` and `Vfs::from_profile` are cfg'd
# the same way so the app never offers a backend this build does not have.
[target.'cfg(not(windows))'.dependencies]
opendal = { workspace = true, features = ["services-sftp"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tempfile = "3"
# The S3 integration tests fetch a presigned URL with no credentials attached,
# which needs a plain HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
