<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep storage/cloud blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D6CF6"/>
      <stop offset="0.55" stop-color="#1E4FD6"/>
      <stop offset="1" stop-color="#123A9E"/>
    </linearGradient>

    <!-- Subtle top sheen -->
    <linearGradient id="sheen" x1="512" y1="80" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- North needle gradient (warm) -->
    <linearGradient id="needleN" x1="512" y1="300" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="1" stop-color="#FF3B5C"/>
    </linearGradient>

    <!-- South needle gradient (cool light) -->
    <linearGradient id="needleS" x1="512" y1="512" x2="512" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#B9CCF2"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0A2470" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App-icon rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#sheen)"/>

  <!-- Compass ring -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="20"/>
  <circle cx="512" cy="512" r="268" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>

  <!-- Backend nodes (the connected storage services) at the four diagonals -->
  <g fill="#EAF1FF" fill-opacity="0.95">
    <circle cx="512" cy="188" r="26"/>
    <circle cx="512" cy="836" r="26"/>
    <circle cx="188" cy="512" r="26"/>
    <circle cx="836" cy="512" r="26"/>
  </g>
  <g fill="#9FBBF5" fill-opacity="0.9">
    <circle cx="742" cy="282" r="17"/>
    <circle cx="742" cy="742" r="17"/>
    <circle cx="282" cy="742" r="17"/>
    <circle cx="282" cy="282" r="17"/>
  </g>

  <!-- Compass needle (diamond pointer) -->
  <g filter="url(#soft)">
    <!-- North half -->
    <path d="M512 300 L565 512 L512 512 Z" fill="url(#needleN)"/>
    <path d="M512 300 L459 512 L512 512 Z" fill="#FF9A90"/>
    <!-- South half -->
    <path d="M512 724 L459 512 L512 512 Z" fill="url(#needleS)"/>
    <path d="M512 724 L565 512 L512 512 Z" fill="#CFDCF7"/>
  </g>

  <!-- Center hub -->
  <circle cx="512" cy="512" r="42" fill="#0E2E86"/>
  <circle cx="512" cy="512" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="8"/>
  <circle cx="512" cy="512" r="12" fill="#ffffff"/>
</svg>
